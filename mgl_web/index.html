<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Private app pages get "X-Robots-Tag: noindex" from nginx (deploy/nginx). The public job
         pages (/jobs, /jobs/:id) stay indexable; sample and closed jobs add their own noindex. -->
    <meta
      name="description"
      content="My Grand Labour connects local workers with job opportunities and lets employers post jobs and review applicants."
    />
    <title>My Grand Labour</title>
    <!-- Before the app, which calls window.mglAnalytics on each route. -->
    <script defer src="/analytics.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
