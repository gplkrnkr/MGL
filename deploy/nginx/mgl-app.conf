# Installed as /etc/nginx/sites-available/mgl-app.
# app.mygrandlabour.com was the first address of the website. Everything now lives on
# mygrandlabour.com, so this host only redirects there (keeping the path). Its certificate stays so
# old https:// links still work; certbot renews it like the others.
server {
    listen 443 ssl;
    server_name app.mygrandlabour.com;
    ssl_certificate /etc/letsencrypt/live/app.mygrandlabour.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.mygrandlabour.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://mygrandlabour.com$request_uri;
}

server {
    listen 80;
    server_name app.mygrandlabour.com;
    return 301 https://mygrandlabour.com$request_uri;
}
