# Security headers for mygrandlabour.com. Installed as /etc/nginx/snippets/mgl-web-headers.conf and
# included in every block that sets add_header (nginx drops inherited add_header directives in any
# block that sets its own).
# - Google/Firebase origins: Firebase phone sign-in (reCAPTCHA + Identity Toolkit).
# - fonts.googleapis.com / fonts.gstatic.com: the home page's web fonts.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://www.google.com; frame-src https://www.google.com https://recaptcha.google.com https://mgl-backend.firebaseapp.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
