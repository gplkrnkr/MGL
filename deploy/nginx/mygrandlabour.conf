# nginx site for mygrandlabour.com on the EC2 server: /etc/nginx/sites-available/mygrandlabour,
# symlinked into sites-enabled. Then run
#   sudo certbot --nginx -d mygrandlabour.com -d www.mygrandlabour.com
# which adds the HTTPS server blocks and the HTTP -> HTTPS redirects to this file.
#
#   /                  the public home page (public/home.html in mgl_web)
#   /api, /files, /health   the FastAPI backend on 127.0.0.1:8000
#   app routes         the React app (worker and employer pages, sign-in), from /var/www/mgl-site
#   anything else      a real 404 (the app's "not found" page, with status 404) so search
#                      engines don't index made-up URLs

server {
    listen 80;
    server_name mygrandlabour.com;

    # nginx's default 1 MB rejects most phone photos before they reach the API's own limit.
    client_max_body_size 12m;

    location ~ ^/(api|files)/|^/health$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends the client address, so with this single proxy the API's TRUSTED_PROXY_HOPS=1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Links from the old proof of concept.
    location = /app { return 301 /; }
    location ^~ /app/ { return 301 /; }

    # A symlink to the current release in /var/www/releases (see the repo README).
    root /var/www/mgl-site;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    include snippets/mgl-web-headers.conf;

    # One URL per page for search engines: the home page lives at / only.
    if ($request_uri ~ ^/(home|index)\.html(\?|$)) {
        return 301 /;
    }

    # Unknown paths get the app's "not found" page with a real 404 status.
    error_page 404 /index.html;

    location = / {
        include snippets/mgl-web-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /home.html =404;
    }

    location /assets/ {
        include snippets/mgl-web-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # React app routes. Keep this list in sync with the first path segment of every route in
    # mgl_web/src/App.tsx (a test in src/lib/pageTitles.test.ts checks it).
    location ~ ^/(login|jobs|applications|profile|worker|employer|admin|agent|demo)(/|$) {
        # index.html must never be cached, or users keep loading old bundles after a deploy.
        include snippets/mgl-web-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Static files (robots.txt, sitemap.xml, images, home.js...); anything missing is a 404.
    location / {
        include snippets/mgl-web-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}

# One address only: www redirects to the main domain (Firebase sign-in only allows authorized
# domains, and sessions are stored per domain). The old app. subdomain has its own site, mgl-app.conf.
# On the server, certbot adds the HTTPS blocks. Its plain-HTTP www block must also redirect straight
# to https://mygrandlabour.com (one hop), not to https://www... first.
server {
    listen 80;
    server_name www.mygrandlabour.com;
    return 301 https://mygrandlabour.com$request_uri;
}
